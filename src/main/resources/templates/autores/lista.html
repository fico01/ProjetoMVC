<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de autores</title>
</head>
<body>
<h2>Lista de Autores</h2>

<div th:each="autores : ${autor}">
    <p>Nome: <span th:text="${autores.nomeAutor}"></span></p>
    <p>Idade: <span th:text="${autores.idade}"></span></p>

    <hr/>
</div>
</body>
</html>
